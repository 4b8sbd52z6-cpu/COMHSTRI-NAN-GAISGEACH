<style>
  /* ============================================================
     WOODEN ARCADE CABINET SHELL
     Everything the player sees is drawn on <canvas>; the CSS here
     only builds the wooden cabinet the screen sits inside.
     ============================================================ */
  :root{
    --wood-dark:#2a1a0c;
    --wood-mid:#6b4622;
    --wood-light:#a3703c;
    --brass:#d8a84b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%;
    background:
      repeating-linear-gradient(94deg, #241609 0 7px, #2c1b0d 7px 15px, #1d1207 15px 22px);
    overflow:hidden;
    font-family:"Courier New",monospace;
    display:flex;align-items:center;justify-content:center;
  }
  #cabinet{
    position:relative;
    padding:14px;
    background:
      repeating-linear-gradient(180deg,var(--wood-mid) 0 6px,#5e3d1d 6px 13px,#754d26 13px 19px);
    border:6px solid var(--wood-dark);
    box-shadow:
      inset 0 0 0 3px var(--wood-light),
      inset 0 0 26px rgba(0,0,0,.55),
      0 18px 48px rgba(0,0,0,.8);
  }
  /* tartan ribbon that frames the screen */
  #cabinet::before{
    content:"";position:absolute;inset:4px;pointer-events:none;
    border:5px solid transparent;
    border-image:repeating-linear-gradient(45deg,
      #0b2a63 0 9px,#f2f2f2 9px 12px,#0b2a63 12px 21px,
      #7d1420 21px 28px,#122f10 28px 33px) 5;
    opacity:.9;
  }
  canvas{
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#05080c;
    border:4px solid #120a03;
    box-shadow:inset 0 0 40px rgba(0,0,0,.9);
    touch-action:none;
  }
  #hint{
    position:absolute;left:0;right:0;bottom:-26px;
    text-align:center;color:#c39b62;font-size:11px;letter-spacing:2px;
  }
  @media (prefers-reduced-motion: reduce){ canvas{transition:none} }
</style>

<body>
<div id="cabinet">
  <canvas id="screen" width="960" height="540" aria-label="Comhstri nan Gaisgeach - Scottish pixel platform fighter"></canvas>
  <div id="hint">TAOBH-DUILLEIG &bull; CLICK THE SCREEN TO GIVE IT FOCUS</div>
</div>

<script>
"use strict";
/* ================================================================
   CÒMHSTRI NAN GAISGEACH  —  "Strife of the Heroes"
   A single-file retro Scottish platform fighter.
   ----------------------------------------------------------------
   Layout of this file:
     1. Core constants + tiny pixel font
     2. Input (keyboard + mouse)
     3. Audio engine (all sounds synthesised, no files)
     4. Sprite art  (characters drawn from pixel maps + limb rigs)
     5. Weapon art
     6. Stages (backgrounds baked once to an offscreen canvas)
     7. UI screens (home / play / pvb / settings / more / lobby)
     8. Character + stage select
     9. Fight: physics, attacks, abilities, AI
    10. HUD, victory screen "Buaidh", multiplayer hooks, main loop
   ================================================================ */

const cv  = document.getElementById('screen');
let ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 960, H = 540;

/* Scale the cabinet to whatever window we are in, keeping 16:9. */
function fitScreen(){
  const pad = 70;
  const s = Math.max(0.35, Math.min((innerWidth-pad)/W, (innerHeight-pad)/H));
  cv.style.width  = Math.floor(W*s)+'px';
  cv.style.height = Math.floor(H*s)+'px';
}
addEventListener('resize', fitScreen); fitScreen();

/* ---------------- Shared palette ---------------- */
const C = {
  wood1:'#7a5230', wood2:'#5e3d1d', wood3:'#3d2812', woodHi:'#b8854c',
  parch:'#f2e3c0', ink:'#221306', brass:'#e0b14a', gold:'#f2c33c',
  saltire:'#0b2a63', white:'#ffffff', blood:'#8d1b20', moss:'#3f5a22'
};

/* =============================================================
   1. PIXEL FONT — 5x7 glyphs, drawn as blocks so every headline
   stays chunky no matter how far we scale it.
   ============================================================= */
const FONT = {

 'R':['11110','10001','10001','11110','10100','10010','10001'],
 'S':['01111','10000','10000','01110','00001','00001','11110'],
 'T':['11111','00100','00100','00100','00100','00100','00100'],
 'U':['10001','10001','10001','10001','10001','10001','01110'],
 'V':['10001','10001','10001','10001','10001','01010','00100'],
 'W':['10001','10001','10001','10101','10101','11011','10001'],
 'X':['10001','10001','01010','00100','01010','10001','10001'],
 'Y':['10001','10001','01010','00100','00100','00100','00100'],
 'Z':['11111','00001','00010','00100','01000','10000','11111'],
 '0':['01110','10011','10101','10101','10101','11001','01110'],
 '1':['00100','01100','00100','00100','00100','00100','01110'],
 '2':['01110','10001','00001','00110','01000','10000','11111'],
 '3':['11111','00010','00100','00010','00001','10001','01110'],
 '4':['00010','00110','01010','10010','11111','00010','00010'],
 '5':['11111','10000','11110','00001','00001','10001','01110'],
 '6':['00110','01000','10000','11110','10001','10001','01110'],
 '7':['11111','00001','00010','00100','01000','01000','01000'],
 '8':['01110','10001','10001','01110','10001','10001','01110'],
 '9':['01110','10001','10001','01111','00001','00010','01100'],
 ' ':['00000','00000','00000','00000','00000','00000','00000'],
 '!':['00100','00100','00100','00100','00100','00000','00100'],
 '?':['01110','10001','00001','00110','00100','00000','00100'],
 '-':['00000','00000','00000','11111','00000','00000','00000'],
 '.':['00000','00000','00000','00000','00000','01100','01100'],
 ',':['00000','00000','00000','00000','01100','01100','01000'],
 "'":['00100','00100','01000','00000','00000','00000','00000'],
 ':':['00000','01100','01100','00000','01100','01100','00000'],
 '/':['00001','00010','00010','00100','01000','01000','10000'],
 '(':['00010','00100','01000','01000','01000','00100','00010'],
 ')':['01000','00100','00010','00010','00010','00100','01000'],
 '+':['00000','00100','00100','11111','00100','00100','00000'],
 '%':['11001','11011','00010','00100','01000','11011','10011'],
 '<':['00010','00100','01000','10000','01000','00100','00010'],
 '>':['01000','00100','00010','00001','00010','00100','01000'],

};
/* Gaelic grave accents get stamped above the base letter. */
const ACCENT = {'À':'A','Ò':'O','È':'E','Ì':'I','Ù':'U','à':'A','ò':'O','è':'E','ì':'I','ù':'U'};

function glyphFor(ch){
  const up = ch.toUpperCase();
  if (FONT[up]) return {rows:FONT[up], accent:false};
  if (ACCENT[ch]) return {rows:FONT[ACCENT[ch]], accent:true};
  return {rows:FONT[' '], accent:false};
}
function textWidth(str, s){ return str.length*6*s - s; }

/* Draw pixel text. align: 'left' | 'center' | 'right'. */
function pxText(str, x, y, s, col, align='left', shadow=null, shadowOff=1){
  const w = textWidth(str, s);
  let cx = align==='center' ? x - w/2 : align==='right' ? x - w : x;
  cx = Math.round(cx); y = Math.round(y);
  for (const ch of str){
    const {rows, accent} = glyphFor(ch);
    for (let r=0;r<7;r++){
      for (let c=0;c<5;c++){
        if (rows[r][c]!=='1') continue;
        if (shadow){ ctx.fillStyle=shadow; ctx.fillRect(cx+c*s+shadowOff*s, y+r*s+shadowOff*s, s, s); }
      }
    }
    if (accent && shadow){ ctx.fillStyle=shadow; ctx.fillRect(cx+s+shadowOff*s, y-2*s+shadowOff*s, s*2, s); }
    cx += 6*s;
  }
  cx = Math.round(align==='center' ? x - w/2 : align==='right' ? x - w : x);
  for (const ch of str){
    const {rows, accent} = glyphFor(ch);
    ctx.fillStyle = col;
    for (let r=0;r<7;r++)
      for (let c=0;c<5;c++)
        if (rows[r][c]==='1') ctx.fillRect(cx+c*s, y+r*s, s, s);
    if (accent){ ctx.fillRect(cx+s, y-2*s, s, s); ctx.fillRect(cx+2*s, y-s, s, s); }
    cx += 6*s;
  }
}

/* =============================================================
   2. INPUT
   ============================================================= */
const Keys = {};
const Pressed = {};          // one-shot "was pressed this frame"
const Mouse = {x:0, y:0, down:false, clicked:false};
function updateMousePosition(e){
  const r = cv.getBoundingClientRect();
  Mouse.x = (e.clientX-r.left) * (W/r.width);
  Mouse.y = (e.clientY-r.top ) * (H/r.height);
}

addEventListener('keydown', e=>{
  if (!Keys[e.code]) Pressed[e.code] = true;
  Keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Slash','Period'].includes(e.code)) e.preventDefault();
  Audio8.unlock();
});
addEventListener('keyup',   e=>{ Keys[e.code] = false; });
cv.addEventListener('mousemove', e=>{
  updateMousePosition(e);
});
cv.addEventListener('mousedown', e=>{
  updateMousePosition(e);
  Mouse.down=true; Mouse.clicked=true; Audio8.unlock(); e.preventDefault();
});
addEventListener('mouseup',  ()=>{ Mouse.down=false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());

function keyTap(code){ return !!Pressed[code]; }
function clearFrameInput(){ for (const k in Pressed) delete Pressed[k]; Mouse.clicked=false; }

/* =============================================================
   3. AUDIO — every sound is synthesised at runtime.
   Each effect is a small instrument: an oscillator (or noise
   burst) shaped by an envelope and a filter, so the set has a
   consistent arcade character instead of flat beeps.
   ============================================================= */
const Audio8 = {
  ac:null, master:null, muted:false, vol:0.55,

  unlock(){
    if (this.ac) { if (this.ac.state==='suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = this.vol;
    const shelf = this.ac.createBiquadFilter();       // soften harsh square tops
    shelf.type='highshelf'; shelf.frequency.value=4200; shelf.gain.value=-7;
    this.master.connect(shelf); shelf.connect(this.ac.destination);
  },
  get t(){ return this.ac ? this.ac.currentTime : 0; },
  setVolume(v){ this.vol=v; if (this.master) this.master.gain.value = this.muted?0:v; },

  /* a shaped oscillator voice */
  tone(o){
    if (!this.ac || this.muted) return;
    const {f=440, f2=null, type='square', dur=0.15, vol=0.3,
           atk=0.005, cut=null, q=1, delay=0, detune=0} = o;
    const t0 = this.t + delay;
    const osc = this.ac.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(f, t0);
    if (f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+dur);
    if (detune) osc.detune.value = detune;
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol), t0+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    let node = osc;
    if (cut){
      const bq = this.ac.createBiquadFilter();
      bq.type='lowpass'; bq.frequency.setValueAtTime(cut, t0);
      bq.frequency.exponentialRampToValueAtTime(Math.max(120,cut*0.25), t0+dur);
      bq.Q.value=q; osc.connect(bq); node = bq;
    }
    node.connect(g); g.connect(this.master);
    osc.start(t0); osc.stop(t0+dur+0.02);
  },

  /* filtered noise burst — impacts, splashes, wind */
  noise(o){
    if (!this.ac || this.muted) return;
    const {dur=0.18, vol=0.3, f=1200, f2=null, q=1, type='bandpass', delay=0} = o;
    const t0 = this.t + delay;
    const n = Math.floor(this.ac.sampleRate*dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const bq = this.ac.createBiquadFilter(); bq.type=type; bq.Q.value=q;
    bq.frequency.setValueAtTime(f, t0);
    if (f2) bq.frequency.exponentialRampToValueAtTime(Math.max(60,f2), t0+dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    src.connect(bq); bq.connect(g); g.connect(this.master);
    src.start(t0);
  },

  /* the pipes: a drone pair plus a chanter note on top */
  pipes(root=233, dur=0.9, vol=0.22){
    this.tone({f:root/2, type:'sawtooth', dur, vol:vol*0.7, cut:900, atk:0.03});
    this.tone({f:root/2*1.5, type:'sawtooth', dur, vol:vol*0.5, cut:900, atk:0.05, detune:6});
    this.tone({f:root*2, f2:root*2.4, type:'square', dur:dur*0.8, vol:vol*0.45, cut:2600, atk:0.02});
  }
};

/* Named effects used by the game. */
const SFX = {

  throwArc(){ Audio8.tone({f:260,f2:520,type:'triangle',dur:0.14,vol:0.16}); },
  wave(){ Audio8.pipes(233,0.75,0.26); Audio8.noise({dur:0.5,vol:0.1,f:600,f2:2400,q:0.8}); },
  jet(){ Audio8.pipes(311,0.55,0.2); Audio8.noise({dur:0.45,vol:0.14,f:900,f2:2600,q:0.6}); },
  stomp(){ Audio8.tone({f:110,f2:45,type:'sine',dur:0.3,vol:0.3});
           Audio8.noise({dur:0.35,vol:0.2,f:700,f2:120,q:1,type:'lowpass'}); },
  splash(){ Audio8.noise({dur:0.34,vol:0.22,f:900,f2:3200,q:0.7});
            Audio8.tone({f:700,f2:1500,type:'sine',dur:0.2,vol:0.1}); },
  bubble(){ Audio8.tone({f:500+Math.random()*400,f2:1200,type:'sine',dur:0.09,vol:0.05}); },
  charge(){ Audio8.tone({f:180,f2:760,type:'sawtooth',dur:0.4,vol:0.2,cut:1800});
            Audio8.noise({dur:0.4,vol:0.14,f:400,f2:2200}); },
  ko(){ Audio8.tone({f:840,f2:90,type:'square',dur:0.6,vol:0.26,cut:2600});
        Audio8.noise({dur:0.5,vol:0.2,f:2400,f2:200}); },
  count(n){ Audio8.tone({f:n===0?880:520,type:'square',dur:0.16,vol:0.2}); },
  fight(){ Audio8.pipes(311,0.7,0.3);
           [523,659,784].forEach((f,i)=>Audio8.tone({f,type:'square',dur:0.2,vol:0.2,delay:i*0.07})); },
  /* short original pentatonic fanfare with a drone underneath */
  victory(){
    const mel = [[392,0],[523,.16],[587,.32],[784,.48],[659,.72],[784,.88],[1046,1.08]];
    mel.forEach(([f,d])=>{ Audio8.tone({f,type:'square',dur:0.26,vol:0.22,delay:d});
                           Audio8.tone({f:f*1.5,type:'triangle',dur:0.22,vol:0.09,delay:d}); });
    Audio8.pipes(233,1.6,0.16);
  }
};

/* =============================================================
   4. PIXEL ART HELPERS
   Sprites are written as character maps. " " is transparent, any
   other letter is looked up in the sprite's palette. Drawing them
   through blit() keeps every edge on the pixel grid.
   ============================================================= */
function blit(map, pal, x, y, px, flip){
  x = Math.round(x); y = Math.round(y);
  const h = map.length;
  for (let r=0;r<h;r++){
    const row = map[r];
    for (let c=0;c<row.length;c++){
      const ch = row[c];
      if (ch===' ') continue;
      const col = pal[ch];
      if (!col) continue;
      const cx = flip ? (row.length-1-c) : c;
      ctx.fillStyle = col;
      ctx.fillRect(x + cx*px, y + r*px, px, px);
    }
  }
}
function rect(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }

/* =============================================================
   5b. REFERENCE ART
   The four fighters and three of the arenas are built straight
   from the supplied images. Each one is background-keyed at full
   resolution, trimmed to a tight box, then re-sampled down and
   punched back up with smoothing off, so what lands on screen is
   the original art in chunky pixel blocks.

function newCanvas(w,h){
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h));
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; return {c,g};
}
/* Strip a uniform picture frame (the unicorn art has a pink one).
   Runs a few passes because those frames often have a second,
   slightly different outer ring, then insets a couple of pixels so
   no anti-aliased fringe is left behind to confuse the key. */
function cropFrame(img){
  const {c,g} = newCanvas(img.width,img.height);
  g.drawImage(img,0,0);
  let box = {x:0,y:0,w:c.width,h:c.height}, trimmed=false;
  for (let pass=0; pass<3; pass++){
    const d = g.getImageData(box.x,box.y,box.w,box.h), p=d.data;
    const at=(x,y)=>{const i=(y*box.w+x)*4; return [p[i],p[i+1],p[i+2]];};
    const near=(a,b,t)=>Math.abs(a[0]-b[0])<t&&Math.abs(a[1]-b[1])<t&&Math.abs(a[2]-b[2])<t;
    const edge = at(0,0);
    let l=0, r=box.w-1, t=0, b=box.h-1;
    const rowIs=(y)=>{ let n=0,m=0; for(let x=0;x<box.w;x+=2){ m++; if(near(at(x,y),edge,26)) n++; } return n>m*0.92; };
    const colIs=(x)=>{ let n=0,m=0; for(let y=0;y<box.h;y+=2){ m++; if(near(at(x,y),edge,26)) n++; } return n>m*0.92; };
    while (t<b && rowIs(t)) t++;   while (b>t && rowIs(b)) b--;
    while (l<r && colIs(l)) l++;   while (r>l && colIs(r)) r--;
    if (l===0 && t===0 && r===box.w-1 && b===box.h-1) break;
    box = {x:box.x+l, y:box.y+t, w:r-l+1, h:b-t+1};
    trimmed = true;
  }
  if (trimmed && box.w>10 && box.h>10){ box = {x:box.x+2, y:box.y+2, w:box.w-4, h:box.h-4}; }
  return {c,g,x:box.x,y:box.y,w:box.w,h:box.h};
}
/* Knock the background out. We flood in from the edges rather than
   deleting every pixel that merely resembles the backdrop, because
   the unicorn is cream on white and a plain colour test would eat
   the horse. Leftover speckle (the kelpie art has snow dots) is
   dropped by binning any connected blob under 1% of the picture. */
function keyOut(img, targetH, targetW){
  const f = cropFrame(img);
  const {c,g} = newCanvas(f.w,f.h);
  g.drawImage(f.c, f.x,f.y,f.w,f.h, 0,0,f.w,f.h);
  const wdt=f.w, hgt=f.h, N=wdt*hgt;
  const d = g.getImageData(0,0,wdt,hgt), p = d.data;
  // the backdrop is the most common colour around the rim
  const tally = {};
  const push=(x,y)=>{ const i=((y*wdt+x)*4); const k=p[i]+','+p[i+1]+','+p[i+2]; tally[k]=(tally[k]||0)+1; };
  for (let x=0;x<wdt;x++){ push(x,0); push(x,hgt-1); }
  for (let y=0;y<hgt;y++){ push(0,y); push(wdt-1,y); }
  let bestK=null, bestN=-1;
  for (const k in tally) if (tally[k]>bestN){ bestN=tally[k]; bestK=k; }
  const key = bestK.split(',').map(Number);
  // deliberately tight: the unicorn's body is cream on a white field,
  // so a loose tolerance would swallow the horse along with the page
  const tol = 12;
  const isBG = i => Math.abs(p[i*4]-key[0])<tol && Math.abs(p[i*4+1]-key[1])<tol && Math.abs(p[i*4+2]-key[2])<tol;
  // 1. flood the backdrop inwards from every edge pixel
  const seen = new Uint8Array(N), stack=[];
  for (let x=0;x<wdt;x++){ stack.push(x, (hgt-1)*wdt+x); }
  for (let y=0;y<hgt;y++){ stack.push(y*wdt, y*wdt+wdt-1); }
  while (stack.length){
    const i = stack.pop();
    if (seen[i] || !isBG(i)) continue;
    seen[i]=1;
    const x=i%wdt, y=(i/wdt)|0;
    if (x>0) stack.push(i-1);
    if (x<wdt-1) stack.push(i+1);
    if (y>0) stack.push(i-wdt);
    if (y<hgt-1) stack.push(i+wdt);
  }
  // 2. bin stray blobs so the fighter is the only thing left
  const label = new Int32Array(N).fill(-1);
  const keep = new Uint8Array(N);
  const minBlob = N*0.01;
  for (let i=0;i<N;i++){
    if (seen[i] || label[i]>=0) continue;
    const blob=[], q=[i]; label[i]=i;
    while (q.length){
      const j=q.pop(); blob.push(j);
      const x=j%wdt, y=(j/wdt)|0;
      const nb=[];
      if (x>0) nb.push(j-1);
      if (x<wdt-1) nb.push(j+1);
      if (y>0) nb.push(j-wdt);
      if (y<hgt-1) nb.push(j+wdt);
      for (const k of nb) if (!seen[k] && label[k]<0){ label[k]=i; q.push(k); }
    }
    if (blob.length>=minBlob) for (const j of blob) keep[j]=1;
  }
  let minX=wdt, minY=hgt, maxX=0, maxY=0, any=false;
  for (let i=0;i<N;i++){
    if (!keep[i]){ p[i*4+3]=0; continue; }
    any=true;
    const x=i%wdt, y=(i/wdt)|0;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  g.putImageData(d,0,0);
  if (!any){ minX=0; minY=0; maxX=wdt-1; maxY=hgt-1; }
  const bw = maxX-minX+1, bh = maxY-minY+1;
  // 3. fit the fighter box, then pixelate: half-size resample, nearest blow-up
  let th = targetH, tw = Math.round(bw*(targetH/bh));
  if (targetW && tw > targetW){ tw = targetW; th = Math.round(bh*(targetW/bw)); }
  const half = newCanvas(Math.max(2,tw/2), Math.max(2,th/2));
  half.g.imageSmoothingEnabled = true;
  half.g.drawImage(c, minX,minY,bw,bh, 0,0,half.c.width,half.c.height);
  const out = newCanvas(tw,th);
  out.g.imageSmoothingEnabled = false;
  out.g.drawImage(half.c, 0,0, tw,th);
  const od = out.g.getImageData(0,0,tw,th);       // hard alpha, no soft halo
  for (let i=3;i<od.data.length;i+=4) od.data[i] = od.data[i]>120 ? 255 : 0;
  out.g.putImageData(od,0,0);
  return out.c;
}
/* photographs used as arenas get the same chunky treatment */
function pixelPhoto(img, blocks){
  const small = newCanvas(blocks, Math.round(blocks*H/W));
  small.g.imageSmoothingEnabled = true;
  const srcAR = img.width/img.height, dstAR = W/H;
  let sw=img.width, sh=img.height, sx=0, sy=0;
  if (srcAR > dstAR){ sw = img.height*dstAR; sx = (img.width-sw)/2; }
  else { sh = img.width/dstAR; sy = (img.height-sh)/2; }
  small.g.drawImage(img, sx,sy,sw,sh, 0,0, small.c.width, small.c.height);
  const out = newCanvas(W,H);
  out.g.imageSmoothingEnabled = false;
  out.g.drawImage(small.c, 0,0, W,H);
  return out.c;
}
const Sprites = {ready:{}, photo:{}};
function loadArt(){
  const chars = [['demo',0,78],['piper',1,80],['kelpie',2,74],['unicorn',3,76]];

    im.src = ART[k];

}

/* =============================================================
   6. CHARACTER SPRITES
   Each fighter is a rig: a pixel-mapped head and torso (where the
   detail lives) plus procedurally posed limbs, so they can run,
   leap, swim and swing without needing dozens of frames.
   ============================================================= */

/* chunky line used for arms, legs, necks and kelp */
function pixLine(x1,y1,x2,y2,size,col){
  const dx=x2-x1, dy=y2-y1;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx,dy)/(size*0.6)));
  ctx.fillStyle = col;
  for (let i=0;i<=steps;i++){
    const px = Math.round((x1+dx*i/steps)/size)*size;
    const py = Math.round((y1+dy*i/steps)/size)*size;
    ctx.fillRect(px, py, size, size);
  }
}

const PX = 3;   // master pixel size for fighters

/* Shared limb timing helper: returns swing phase for legs/arms. */
function gait(a){
  if (a.state==='run')  return Math.sin(a.t*0.30);
  if (a.state==='swim') return Math.sin(a.t*0.22);
  if (a.state==='jump' || a.state==='fall') return 0.6;
  return Math.sin(a.t*0.06)*0.12;      // idle breathing
}

/* ---- biped leg + arm rig (Highlander & Piper) ---- */
function bipedLegs(x, yF, a, g, pantsA, pantsB, boot){
  const sw = g*9;
  const hipY = yF-26;
  // back leg
  pixLine(x-4+sw*0.6, hipY, x-6+sw, yF-7, PX, pantsB);
  rect(x-9+sw, yF-7, 11, 7, boot);
  // front leg
  pixLine(x+3-sw*0.6, hipY, x+5-sw, yF-7, PX, pantsA);
  rect(x+1-sw, yF-7, 11, 7, boot);
}

/* =============================================================
   Fighter draw entry point. `a` carries animation state:
   {state, t, atk, atkMax, facing, weapon, flash}
   ============================================================= */
function drawCharacterRig(id, x, yF, facing, a){
  ctx.save();
  if (a.state==='swim'){                      // tilt into the stroke
    ctx.translate(x, yF-30); ctx.rotate(facing*-0.30); ctx.translate(-x, -(yF-30));
  }
  if (a.flash>0 && Math.floor(a.t/2)%2===0) ctx.globalAlpha = 0.65;
  switch(id){
    case 0: drawHighlander(x,yF,facing,a); break;
    case 1: drawPiper(x,yF,facing,a);      break;
    case 2: drawKelpie(x,yF,facing,a);     break;
    case 3: drawUnicorn(x,yF,facing,a);    break;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* swing angle for a melee attack: wind-up then a fast arc */
function swingAngle(a, from, to){
  if (!a.atk) return from;
  const p = 1 - a.atk/a.atkMax;                    // 0 -> 1
  const e = p<0.35 ? -(p/0.35)*0.5 : (p-0.35)/0.65; // small wind-up, then swing
  return from + (to-from)*Math.max(-0.5, e);
}

/* ---------------- CLAIDHEAMH-MÒR ---------------- */
function drawHighlander(x, yF, facing, a){
  const f = facing<0, g = gait(a);
  const bob = (a.state==='idle') ? Math.round(Math.sin(a.t*0.07)) : 0;
  const torsoY = yF-26-HL_TORSO.length*PX+bob;
  const headY  = torsoY-HL_HEAD.length*PX+PX;
  const cx = x - (13*PX)/2;

  bipedLegs(x,yF,a,g,'#7d2a1e','#5e1d15','#141414');

  // back arm (holds the off-hand)
  pixLine(x-facing*6, torsoY+10, x-facing*16, torsoY+24, PX, '#5e1d15');
  blit(HL_TORSO, HL_PAL, cx, torsoY, PX, f);
  blit(HL_HEAD,  HL_PAL, x-(12*PX)/2+facing*2, headY, PX, f);
  // bandolier strap across the chest
  pixLine(x-facing*12, torsoY+4, x+facing*10, torsoY+20, PX, '#3a2a18');

  // front arm + weapon
  const wpn = a.weapon|0;
  const sh = {x:x+facing*8, y:torsoY+11};
  let ang, map, ax, ay, scale=PX;
  if (wpn===0){ ang = swingAngle(a, -0.9, 1.5); map=CLAYMORE; }
  else if (wpn===1){ ang = swingAngle(a, -1.5, 1.9); map=LOCHABER; }
  else { ang = swingAngle(a, -0.2, 0.9); map=SGIAN; scale=PX; }
  const hand = {x: sh.x + Math.cos(ang*facing + (facing<0?Math.PI:0))*16,
                y: sh.y + Math.sin(ang)*14};
  pixLine(sh.x, sh.y, hand.x, hand.y, PX, '#8c2f22');
  rect(hand.x-3, hand.y-3, 7, 7, '#7a4a2a');

  ctx.save();
  ctx.translate(hand.x, hand.y);
  ctx.rotate(facing*(ang+ (wpn===2?0.4:0.2)) + (facing<0?Math.PI:0));
  const mw = map[0].length*scale;
  blit(map, WPN_PAL, -mw/2, -map.length*scale+6, scale, false);
  ctx.restore();
}

function drawPiper(x, yF, facing, a){
  const f = facing<0, g = gait(a);

  bipedLegs(x,yF,a,g,'#2b4b7a','#1e3757','#16181c');
  // tartan kilt, woven procedurally so it never looks flat
  const kw=34, kh=22, kx=x-kw/2, ky=yF-30;
  rect(kx,ky,kw,kh,'#a01f2a');
  for (let i=0;i<kw;i+=8) rect(kx+i,ky,3,kh,'#0b2a63');
  for (let j=0;j<kh;j+=7) rect(kx,ky+j,kw,2,'#0b2a63');
  for (let i=4;i<kw;i+=8) rect(kx+i,ky,1,kh,'#f2f2f2');
  rect(kx,ky+kh-3,kw,3,'#7d1420');

  rect(x-6+facing*2, ky+kh-12, 12, 11, '#e8e2d2');
  rect(x-6+facing*2, ky+kh-12, 12, 3,  '#3a2a18');

  blit(PI_TORSO, PI_PAL, x-(13*PX)/2, torsoY, PX, f);
  blit(PI_HEAD,  PI_PAL, x-(12*PX)/2+facing*2, headY, PX, f);

  // both arms cradle the pipes; the drones rest on the shoulder
  const puff = a.atk ? 1-(a.atk/a.atkMax) : 0;
  const bx = x+facing*(12+puff*8), by = torsoY+12+Math.sin(a.t*0.1)*1;
  pixLine(x+facing*7, torsoY+8, bx, by, PX, '#1b2a4d');
  pixLine(x-facing*4, torsoY+10, bx-facing*4, by+6, PX, '#22345e');
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(facing*(-0.35 - puff*0.5) + (facing<0?Math.PI:0));
  blit(BAGPIPES, WPN_PAL, -12, -14, PX, false);
  ctx.restore();
}

/* ---------------- horses: shared four-leg rig ---------------- */
function horseLegs(x,yF,a,colA,colB,hoof){
  const s = (a.state==='run')  ? Math.sin(a.t*0.34)
          : (a.state==='swim') ? Math.sin(a.t*0.2)
          : (a.state==='jump'||a.state==='fall') ? 0.8 : Math.sin(a.t*0.05)*0.1;
  const top = yF-30;
  const legs = [[-26, s], [-18,-s], [14,-s*0.9], [22, s*0.9]];
  legs.forEach(([off,ph],i)=>{
    const col = i<2 ? colB : colA;
    pixLine(x+off, top, x+off+ph*7, yF-6, PX, col);
    rect(x+off+ph*7-3, yF-6, 8, 6, hoof);
  });
}

function drawKelpie(x, yF, facing, a){

  const bw = KE_BODY[0].length*PX;

  // ghost shimmer behind the body
  ctx.globalAlpha=0.20; rect(bx-4, by-4, bw+8, KE_BODY.length*PX+10, '#8fd3c8'); ctx.globalAlpha=1;
  blit(KE_BODY, KE_PAL, bx, by, PX, f);
  // kelp mane + tail: strands that drift with their own sine
  const neckX = x + facing*22, neckY = by+10;
  for (let i=0;i<7;i++){

  const tailX = x - facing*36;
  for (let i=0;i<6;i++){
    const t = a.t*0.045 + i*0.9;
    pixLine(tailX, by+14+i*2, tailX - facing*(10+Math.sin(t)*7), by+26+i*4+Math.cos(t)*5, PX, i%2?'#4a8a30':'#77c24a');
  }
  // eye-sockets glow when attacking
  if (a.atk){ ctx.globalAlpha=0.8; rect(x+facing*30, by+9, 5,5,'#b6ff7a'); ctx.globalAlpha=1; }
}

   supplied sprite and rig the weapon on top of it; until then the
   hand-built version above stands in.

const BASE_FACE = [1, 1, -1, 1];   // which way each source image looks
/* the kelpie art includes the loch it is rising out of, so it is
   seated a little lower to put its hooves on the platform */
const ART_FOOT = [0, 0, 11, 0];

function drawHeldWeapon(id, x, yF, facing, a){
  if (id===0){
    const wpn = a.weapon|0;
    let map, ang;
    if (wpn===0){ map=CLAYMORE; ang=swingAngle(a,-0.9,1.5); }
    else if (wpn===1){ map=LOCHABER; ang=swingAngle(a,-1.5,1.9); }
    else { map=SGIAN; ang=swingAngle(a,-0.2,0.9); }
    const hx = x+facing*17, hy = yF-44;
    rect(hx-4,hy-4,9,9,'#7a4a2a');
    ctx.save(); ctx.translate(hx,hy);
    ctx.rotate(facing*(ang+0.2) + (facing<0?Math.PI:0));
    blit(map, WPN_PAL, -map[0].length*PX/2, -map.length*PX+6, PX, false);
    ctx.restore();
  } else if (id===1){
    const puff = a.atk ? 1-(a.atk/a.atkMax) : 0;
    const hx = x+facing*(15+puff*9), hy = yF-46+Math.sin(a.t*0.1);
    ctx.save(); ctx.translate(hx,hy);
    ctx.rotate(facing*(-0.35 - puff*0.5) + (facing<0?Math.PI:0));
    blit(BAGPIPES, WPN_PAL, -12, -14, PX, false);
    ctx.restore();
  }
}
function drawCharacter(id, x, yF, facing, a){
  const img = Sprites.ready[id];
  if (!img) return drawCharacterRig(id, x, yF, facing, a);
  const lunge = a.atk ? Math.sin((1-a.atk/a.atkMax)*Math.PI)*facing*9 : 0;
  const bob   = a.state==='idle' ? Math.round(Math.sin(a.t*0.07))
              : a.state==='run'  ? -Math.round(Math.abs(Math.sin(a.t*0.3))*2) : 0;
  let rot = 0;
  if (a.state==='swim')   rot = -0.32*facing;
  if (a.state==='hurt')   rot =  0.22*facing;
  if (a.state==='charge') rot = -0.14*facing;
  if (a.state==='jump')   rot = -0.08*facing;
  if (a.state==='fall')   rot =  0.06*facing;
  if (id===3 && a.state==='charge'){ ctx.globalAlpha=0.3; rect(x-facing*70, yF-60, 70, 34, '#cfe8ef'); ctx.globalAlpha=1; }
  if (id===2 && a.atk){ ctx.globalAlpha=0.22; rect(x-44, yF-70, 88, 70, '#8fd3c8'); ctx.globalAlpha=1; }
  ctx.save();
  ctx.translate(x+lunge, yF+bob);
  if (rot) ctx.rotate(rot);
  if (facing !== BASE_FACE[id]) ctx.scale(-1,1);
  if (a.flash>0 && Math.floor(a.t/2)%2===0) ctx.globalAlpha = 0.6;
  ctx.drawImage(img, -Math.round(img.width/2), -img.height + ART_FOOT[id]);
  ctx.restore();
  ctx.globalAlpha = 1;
  drawHeldWeapon(id, x, yF, facing, a);
}

/* =============================================================
   8. STAGES
   Each background is painted once into an offscreen canvas from
   the reference photographs, then the animated layer (clouds,
   rays, bubbles, torchlight) is drawn over it every frame.
   ============================================================= */
let rngSeed = 1337;
function rnd(){ rngSeed = (rngSeed*1664525 + 1013904223) & 0x7fffffff; return rngSeed/0x7fffffff; }
function seed(s){ rngSeed = s; }

function bakeCanvas(paint){
  const off = document.createElement('canvas');
  off.width=W; off.height=H;
  const c = off.getContext('2d');
  c.imageSmoothingEnabled=false;
  paint(c);
  return off;
}
/* chunky 4px dither used to keep photographic gradients pixelated */
function grain(c, x,y,w,h, col, density, size=4){
  c.fillStyle = col;
  for (let i=0;i<density;i++){
    const gx = x + Math.floor(rnd()*w/size)*size;
    const gy = y + Math.floor(rnd()*h/size)*size;
    c.fillRect(gx,gy,size,size);
  }
}
function vgrad(c, x,y,w,h, stops){
  const g = c.createLinearGradient(0,y,0,y+h);
  stops.forEach(([p,col])=>g.addColorStop(p,col));
  c.fillStyle=g; c.fillRect(x,y,w,h);
}

/* ---------- STAGE 1: DOIMHNEACHD LOCH NIS ---------- */
function bakeLochNess(){ return bakeCanvas(c=>{
  seed(11);
  vgrad(c,0,0,W,H,[[0,'#3fb3c6'],[0.25,'#1f8fab'],[0.6,'#136a86'],[1,'#07283a']]);
  // shafts of light angling down from the surface
  c.save(); c.globalAlpha=0.13; c.fillStyle='#d8f7ff';
  for (let i=0;i<9;i++){
    const x = -120 + i*130 + rnd()*40;
    c.beginPath(); c.moveTo(x,0); c.lineTo(x+52,0); c.lineTo(x+150,H); c.lineTo(x+88,H); c.fill();
  }
  c.restore();
  // Nessie: a long-necked silhouette rising from the murk on the left
  c.fillStyle='#0d4058';
  const body=[[0,470],[150,430],[210,436],[250,470],[120,510],[0,520]];
  c.beginPath(); c.moveTo(body[0][0],body[0][1]); body.forEach(p=>c.lineTo(p[0],p[1])); c.fill();
  c.fillRect(60,300,120,40); c.fillRect(40,330,90,110);      // neck
  c.fillRect(140,286,110,44); c.fillRect(150,320,86,20);     // head + jaw
  c.fillStyle='#e7f6fb'; for(let i=0;i<7;i++) c.fillRect(162+i*11,318,6,6); // teeth
  c.fillStyle='#08303f'; c.fillRect(150,470,220,26);         // flipper
  grain(c,0,0,W,H,'rgba(255,255,255,0.05)',900);
  grain(c,0,H*0.5,W,H*0.5,'rgba(0,20,40,0.12)',700);
});}

function bakeCallanish(){ return bakeCanvas(c=>{

  // streaked dusk cloud bands
  c.globalAlpha=0.35;
  for (let i=0;i<26;i++){
    const y=20+rnd()*260, w=120+rnd()*380, x=rnd()*W;

    c.fillRect(x,Math.floor(y/4)*4,w,4+Math.floor(rnd()*3)*4);

  c.fillStyle='#4a4a3a';
  for (let x=0;x<W;x+=16) c.fillRect(x, 392+Math.sin(x*0.02)*10, 16, 30);

  grain(c,0,415,W,H-415,'#6b7a33',700);
  grain(c,0,415,W,H-415,'#e2c65a',120);

                [700,300,26,160],[760,340,20,120],[848,286,28,170],[900,330,18,130]];

});}

function bakeVaults(){ return bakeCanvas(c=>{
  seed(53);

  for (let y=0;y<H;y+=30){

  // barrel-vault arches receding into the dark
  [[200,0.55],[480,0.8],[760,0.55]].forEach(([ax,s])=>{
    c.fillStyle='#120f0c';
    c.beginPath(); c.arc(ax, 300, 110*s, Math.PI, 0); c.fill();
    c.fillRect(ax-110*s, 300, 220*s, 240);
    c.fillStyle='#2b2620';
    c.beginPath(); c.arc(ax, 300, 110*s, Math.PI, 0); c.fill();
    c.fillStyle='#0a0908';
    c.beginPath(); c.arc(ax, 306, 92*s, Math.PI, 0); c.fill();

  grain(c,0,0,W,H,'rgba(0,0,0,0.5)',1400);

});}

/* ---- wooden plank panel with iron rivets ---- */
function woodPanel(x,y,w,h,hi){
  rect(x,y,w,h,'#3d2812');
  for (let i=0;i<h-8;i+=7){
    rect(x+4,y+4+i,w-8,4, i%14===0 ? '#7a5230' : '#6a4526');
  }
  rect(x+4,y+4,w-8,2,'#a3703c');

  rect(x,y,w,3,'#8a6236'); rect(x,y+h-3,w,3,'#241505');

}
/* ---- woven tartan ribbon (Black Watch reds and blues) ---- */
function tartanStrip(x,y,w,h,step=14){
  rect(x,y,w,h,'#7d1420');
  for (let i=0;i<w;i+=step){
    rect(x+i,y,step*0.5,h,'#0b2a63');
    rect(x+i+step*0.5,y,2,h,'#f2f2f2');
    rect(x+i+2,y,2,h,'#1d4a1c');
  }
  for (let j=0;j<h;j+=step){
    ctx.globalAlpha=0.35; rect(x,y+j,w,3,'#000'); ctx.globalAlpha=1;
    rect(x,y+j+4,w,2,'#f2f2f2');
  }
}
function tartanFrame(x,y,w,h,t=10){
  tartanStrip(x,y,w,t); tartanStrip(x,y+h-t,w,t);
  tartanStrip(x,y,t,h); tartanStrip(x+w-t,y,t,h);
}
/* ---- pixel Saltire, waving on a sine ---- */
function saltire(x,y,w,h,t,px=6,alpha=1){
  ctx.globalAlpha=alpha;
  const cols = Math.floor(w/px), rows = Math.floor(h/px);
  for (let cx=0;cx<cols;cx++){
    const wave = Math.sin(cx*0.24 + t*0.05)*(px*1.1) + Math.sin(cx*0.11 - t*0.03)*(px*0.6);
    const shade = Math.sin(cx*0.24 + t*0.05);
    for (let cy=0;cy<rows;cy++){
      const u = cx/cols, v = cy/rows;
      const onCross = Math.abs(u-v) < 0.11 || Math.abs(u-(1-v)) < 0.11;
      let col = onCross ? '#ffffff' : '#0b2a63';
      if (shade < -0.35) col = onCross ? '#cfd8e6' : '#071d47';
      if (shade >  0.55) col = onCross ? '#ffffff' : '#12397f';
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x+cx*px), Math.round(y+cy*px+wave), px, px);
    }
  }
  ctx.globalAlpha=1;
}
/* ---- thistle emblem ---- */
function thistle(x,y,s){
  rect(x-s*0.5,y+s*1.2,s,s*2.2,'#3f6b2a');            // stem
  rect(x-s*1.6,y+s*1.8,s*1.3,s*0.6,'#3f6b2a');        // leaf
  rect(x+s*0.4,y+s*2.4,s*1.3,s*0.6,'#3f6b2a');
  rect(x-s,y+s*0.2,s*2,s*1.2,'#4d6b2f');              // bulb
  rect(x-s*0.8,y+s*0.4,s*1.6,s*0.5,'#6b8a3f');
  for (let i=0;i<7;i++){                               // purple crown
    const dx=(i-3)*s*0.42;
    rect(x+dx-s*0.18, y-s*1.2-Math.abs(i-3)*s*0.16, s*0.36, s*1.5, i%2?'#8e5bb5':'#b07fd4');
  }
}

/* generic vertical menu handling (keys + mouse) */
let menu = {items:[], idx:0};
function setMenu(items){ menu = {items, idx:0}; }
function updateMenu(){
  const n = menu.items.length; if (!n) return;
  if (keyTap('ArrowDown')||keyTap('KeyS')){ menu.idx=(menu.idx+1)%n; SFX.move(); }
  if (keyTap('ArrowUp')  ||keyTap('KeyW')){ menu.idx=(menu.idx+n-1)%n; SFX.move(); }
  let hovered = -1;
  menu.items.forEach((b,i)=>{
    if (Mouse.x>b.x && Mouse.x<b.x+b.w && Mouse.y>b.y && Mouse.y<b.y+b.h) hovered=i;
  });
  if (hovered>=0){
    if (menu.idx!==hovered){ menu.idx=hovered; SFX.move(); }
    if (Mouse.clicked){
      SFX.pick();
      const clicked = menu.items[hovered];
      clicked.go();
      return;
    }
  }
  if (keyTap('Enter')||keyTap('Space')||keyTap('KeyE')){ SFX.pick(); menu.items[menu.idx].go(); }
  if (keyTap('Escape')||keyTap('Backspace')) goBack();
}
function drawMenu(){ menu.items.forEach((b,i)=>uiButton(b,i===menu.idx)); }

/* =============================================================
   11. MULTIPLAYER SHELL  (3+ MODE)
   The game already routes every fighter through an input packet,
   so wiring real networking later only means implementing a
   transport with three methods and calling Net.receive() when a
   packet arrives. Nothing else in the game needs to change.

       Net.attachTransport({
         host(code)   { ...open a room, e.g. WebSocket / WebRTC... },
         join(code)   { ...connect to that room... },
         send(packet) { ...ship the object to everyone else... }
       });
       // then, whenever a packet lands:  Net.receive(packet)
   ============================================================= */
const Net = {
  status:'offline',            // offline | hosting | connecting | joined
  code:null,
  transport:null,
  channel:null,
  localSeat:null,
  connections:[],
  connectTimer:null,
  seats:[null,null,null,null], // seat -> player name
  log:[],

  supabaseUrl:'https://hwpjwgounkttsdnulbsw.supabase.co',
  supabaseKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3cGp3Z291bmt0dHNkbnVsc3ciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4OTU3NDU5OCwiZXhwIjoyMTA1MTUwNTk4fQ.91bZgbMRYuBYUcpxoVho24cIeONH8XfazzdNNEsOwMU',
  realtime:null,

  attachTransport(t){ this.transport = t; this.note('TRANSPORT ATTACHED'); },
  makeCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
              for(let i=0;i<5;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; },
  normalizeCode(code){ return String(code||'').trim().toUpperCase().replace(/[^A-Z2-9]/g,'').slice(0,5); },
  channelName(){ return 'comhstri-room-' + this.code.toLowerCase(); },
  setupChannel(){
    if (!window.supabase){ this.note('SUPABASE LIBRARY UNAVAILABLE'); return false; }
    if (!this.realtime) this.realtime=window.supabase.createClient(this.supabaseUrl,this.supabaseKey);
    if (this.channel) this.realtime.removeChannel(this.channel);
    this.channel=this.realtime.channel(this.channelName());
    this.channel.on('broadcast',{event:'room'}, ({payload})=>this.handleData(null,payload));
    return true;
  },
  broadcast(data){ if (this.channel) this.channel.send({type:'broadcast',event:'room',payload:data}); },
  host(){
    this.code = this.makeCode(); this.status='hosting'; this.localSeat=0;
    this.closePeer();
    if (!this.setupChannel()) return;
    this.seats=[ 'PLAYER 1', null, null, null ];
    this.note('ROOM OPENED  '+this.code);
    this.channel.subscribe((status)=>{
      if (status==='SUBSCRIBED') this.note('PLAYER 1 READY - WAITING FOR PLAYER 2');
      if (status==='CHANNEL_ERROR') this.note('ROOM SERVER ERROR');
    });
    if (this.transport) this.transport.host(this.code);
  },
  join(code){
    code=this.normalizeCode(code);
    if (code.length!==5){ this.note('ROOM CODE MUST BE 5 CHARACTERS'); return; }
    this.closePeer();
    this.code = code; this.status='connecting'; this.localSeat=null;
    if (!this.setupChannel()) return;
    this.seats=[ 'PLAYER 1', null, null, null ];
    this.note('CONNECTING AS PLAYER 2');
    this.connectTimer=setTimeout(()=>{
      if (this.status==='connecting'){
        this.closePeer(); this.status='offline'; this.note('CONNECTION TIMED OUT - TRY AGAIN');
      }
    }, 8000);
    this.channel.subscribe((status)=>{
      if (status==='SUBSCRIBED'){
        this.broadcast({type:'hello'});
        this.note('CONNECTED - WAITING FOR PLAYER 2 SLOT');
      }
      if (status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        if (this.connectTimer){ clearTimeout(this.connectTimer); this.connectTimer=null; }
        this.status='offline'; this.note('ROOM NOT FOUND - CHECK THE CODE');
      }
    });
    if (this.transport) this.transport.join(this.code);
  },
  handleData(conn,data){
    if (!data) return;
    if (data.type==='hello' && this.status==='hosting'){
      if (this.seats[1]){ this.broadcast({type:'full'}); return; }
      this.seats[1]='PLAYER 2';
      this.broadcast({type:'welcome', seat:1, seats:this.seats});
      this.syncParty(); this.note('PLAYER 2 CONNECTED'); return;
    }
    if (data.type==='welcome'){
      if (this.connectTimer){ clearTimeout(this.connectTimer); this.connectTimer=null; }
      this.localSeat=data.seat; this.status='joined'; this.seats=data.seats||['PLAYER 1','PLAYER 2',null,null];
      this.seats[this.localSeat]='PLAYER 2'; this.note('YOU ARE PLAYER 2'); return;
    }
    if (data.type==='full'){ this.note('ROOM FULL'); return; }
    if (data.type==='party-state'){
      if (data.phase==='char' || data.phase==='stage' || data.phase==='fight') G.mode='party';
      this.seats=data.seats;
      if (data.slots && G.mode==='party'){
        G.slots=data.slots.map(slot=>({type:slot.type, char:slot.char==null?null:CHARS[slot.char]}));
      }
      if (data.phase==='char' && G.screen==='lobby'){ setScreen('char'); }
      if (data.phase==='stage' && G.screen==='char'){ setScreen('stage'); }
      if (data.phase==='fight' && G.screen!=='fight'){ G.stage=data.stage; startMatch(); }
      return;
    }
    if (data.type==='party-selection' && this.status==='hosting'){
      if (G.mode==='party' && G.slots[data.seat]){
        G.slots[data.seat].char=CHARS[data.char];
        this.syncParty();
      }
      return;
    }
    if (data.seat==null) return;
    this.receive(data);
  },
  closePeer(){
    if (this.connectTimer){ clearTimeout(this.connectTimer); this.connectTimer=null; }
    if (this.channel && this.realtime) this.realtime.removeChannel(this.channel);
    this.channel=null; this.connections=[];
  },
  leave(){ this.closePeer(); this.status='offline'; this.code=null; this.localSeat=null; this.seats=[null,null,null,null]; this.note('LEFT ROOM'); },
  /* called every frame during a fight; harmless while offline */
  send(packet){
    if (this.transport) this.transport.send(packet);
    this.broadcast(Object.assign({type:'input'}, packet));
  },
  syncParty(){
    if (this.status!=='hosting' || !G.slots) return;
    const state={type:'party-state', seats:this.seats,
      slots:G.slots.map(slot=>({type:slot.type, char:slot.char&&slot.char.id})),
      phase:G.screen==='lobby'?'lobby':G.screen==='char'?'char':G.screen==='stage'?'stage':G.screen==='fight'?'fight':'lobby',
      stage:G.stage};
    this.broadcast(state);
  },
  startPartyStage(stage){
    G.stage=stage; this.broadcast({type:'party-state', seats:this.seats,
      slots:G.slots.map(slot=>({type:slot.type, char:slot.char&&slot.char.id})), phase:'fight', stage});
    startMatch();
  },
  /* call this from the transport when a remote packet arrives */
  receive(packet){
    if (!packet || packet.seat==null) return;
    const p = fighters.find(f=>f.port===packet.seat);
    if (p && p.remote) p.netInput = packet.input;
  },
  inviteLink(){ return location.origin + location.pathname + '?room=' + (this.code||'-----'); },
  copyInvite(){
    const link = this.inviteLink();
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(link).then(()=>this.note('INVITE LINK COPIED'))
        .catch(()=>this.copyInviteFallback(link));
    } else this.copyInviteFallback(link);
  },
  copyInviteFallback(link){
    const field = document.createElement('textarea');
    field.value = link; field.setAttribute('readonly','');
    field.style.position='fixed'; field.style.opacity='0';
    document.body.appendChild(field); field.select();
    try { document.execCommand('copy'); this.note('INVITE LINK COPIED'); }
    catch (_) { this.note('COPY FAILED - USE ROOM CODE'); }
    document.body.removeChild(field);
  },
  note(m){ this.log.unshift(m); if (this.log.length>5) this.log.pop(); }
};

                                          Net.seats[2]?'human':'cpu', Net.seats[3]?'human':'cpu');
  G.cursor = 0; G.pick = 0;
  menu = {items:[], idx:0};
}
const CELL = {x:64, y:106, w:204, h:180, gap:8};
function cellRect(i){ return {x:CELL.x+i*(CELL.w+CELL.gap), y:CELL.y, w:CELL.w, h:CELL.h}; }
function boxRect(i){ return {x:64+i*(CELL.w+CELL.gap), y:314, w:CELL.w, h:112}; }

function nextOpenSlot(from){
  for (let i=0;i<4;i++){ const k=(from+i)%4; if (G.slots[k].type!=='off' && !G.slots[k].char) return k; }
  return -1;
}
function assign(charId){
  let k = nextOpenSlot(G.pick);
  if (G.mode==='party'){
    const own = Net.localSeat==null ? 0 : Net.localSeat;
    if (G.slots[own] && G.slots[own].type==='human' && !G.slots[own].char) k=own;
    else if (Net.status==='hosting') k=G.slots.findIndex(slot=>slot.type==='cpu' && !slot.char);
  }
  if (k<0){ SFX.deny(); return; }
  G.slots[k].char = CHARS[charId];
  G.pick = (k+1)%4;
  if (G.mode==='party'){
    if (Net.status==='hosting') Net.syncParty();
    else Net.broadcast({type:'party-selection', seat:Net.localSeat, char:charId});
  }
  SFX.pick();
}
function readyToFight(){
  const live = G.slots.filter(s=>s.type!=='off');
  return live.length>=2 && live.every(s=>s.char);
}
function updateCharSelect(){
  if (keyTap('ArrowRight')||keyTap('KeyD')){ G.cursor=(G.cursor+1)%4; SFX.move(); }
  if (keyTap('ArrowLeft') ||keyTap('KeyA')){ G.cursor=(G.cursor+3)%4; SFX.move(); }
  if (keyTap('Enter')||keyTap('Space')||keyTap('KeyE')) assign(G.cursor);
  if (keyTap('Backspace')){ const k=(G.pick+3)%4; G.slots[k].char=null; G.pick=k; SFX.back(); }
  if (keyTap('Escape')) goBack();

  for (let i=0;i<4;i++){
    const r = cellRect(i);
    if (Mouse.x>r.x&&Mouse.x<r.x+r.w&&Mouse.y>r.y&&Mouse.y<r.y+r.h){
      if (G.cursor!==i){ G.cursor=i; SFX.move(); }
      if (Mouse.clicked) assign(i);
    }
    const b = boxRect(i);
    if (Mouse.clicked && Mouse.x>b.x&&Mouse.x<b.x+b.w&&Mouse.y>b.y&&Mouse.y<b.y+b.h){
      const s = G.slots[i];
      const cycle = (G.mode==='duel') ? ['human','cpu'] : ['human','cpu','off'];
      if (i===0){ SFX.deny(); }                        // player one always plays
            else if (G.mode==='party' && Net.seats[i]){ SFX.deny(); }
      else { s.type = cycle[(cycle.indexOf(s.type)+1)%cycle.length];
              if (s.type==='off') s.char=null;
              if (G.mode==='party' && Net.status==='hosting') Net.syncParty();
              SFX.move(); }
    }
  }
  const go = {x:W/2-150,y:442,w:300,h:52};
  const over = Mouse.x>go.x&&Mouse.x<go.x+go.w&&Mouse.y>go.y&&Mouse.y<go.y+go.h;
  if ((over&&Mouse.clicked) || keyTap('KeyF')){
    if (readyToFight() && (G.mode!=='party' || Net.status==='hosting')){
      SFX.pick(); setScreen('stage'); if (G.mode==='party') Net.syncParty();
    } else SFX.deny();
  }
}

function stageRect(i){ return {x:70+(i%2)*440, y:110+Math.floor(i/2)*180, w:400, h:158}; }
function updateStageSelect(){
  if (keyTap('ArrowRight')||keyTap('KeyD')){ G.cursor=(G.cursor+1)%4; SFX.move(); }
  if (keyTap('ArrowLeft') ||keyTap('KeyA')){ G.cursor=(G.cursor+3)%4; SFX.move(); }
  if (keyTap('ArrowDown') ||keyTap('KeyS')){ G.cursor=(G.cursor+2)%4; SFX.move(); }
  if (keyTap('ArrowUp')   ||keyTap('KeyW')){ G.cursor=(G.cursor+2)%4; SFX.move(); }
  for (let i=0;i<4;i++){
    const r=stageRect(i);
    if (Mouse.x>r.x&&Mouse.x<r.x+r.w&&Mouse.y>r.y&&Mouse.y<r.y+r.h){
      if (G.cursor!==i){ G.cursor=i; SFX.move(); }
      if (Mouse.clicked){
        G.stage=i; SFX.pick();
        if (G.mode==='party' && Net.status==='hosting') Net.startPartyStage(i);
        else if (G.mode!=='party') startMatch();
      }
    }
  }
  if (keyTap('Enter')||keyTap('Space')||keyTap('KeyE')){
    G.stage=G.cursor; SFX.pick();
    if (G.mode==='party' && Net.status==='hosting') Net.startPartyStage(G.stage);
    else if (G.mode!=='party') startMatch();
  }
  if (keyTap('Escape')) goBack();
}
function drawStageSelect(){
  vgradScreen([[0,'#141c2c'],[1,'#2a1a0c']]);
  menuHeader('TAGH AN RAON', 'CHOOSE THE GROUND');
  for (let i=0;i<4;i++){
    const r=stageRect(i), s=STAGES[i], sel=G.cursor===i;
    rect(r.x-4,r.y-4,r.w+8,r.h+8, sel?'#f2c33c':'#1d1108');
    woodPanel(r.x,r.y,r.w,r.h,sel);
    ctx.drawImage(stageBG(i), r.x+8, r.y+8, r.w-16, r.h-52);
    // sketch the platforms over the preview so layouts are readable
    ctx.globalAlpha=0.9;
    s.plats.forEach(p=> rect(r.x+8+p.x*(r.w-16)/W, r.y+8+p.y*(r.h-52)/H,
                             Math.max(3,p.w*(r.w-16)/W), Math.max(3,p.h*(r.h-52)/H), p.pass?'#d8c9a0':'#f2e3c0'));
    ctx.globalAlpha=1;
    pxText(s.pretty.length>22?s.name:s.pretty, r.x+r.w/2, r.y+r.h-38, 2, sel?'#fff3d0':'#e7cfa3','center','#160c03');
    pxText(s.sub, r.x+r.w/2, r.y+r.h-20, 2, '#c9a978','center');
  }
  footerHint('ENTER OR CLICK TO BEGIN  -  ESC TO GO BACK');
}

/* =============================================================
   14. THE FIGHT
   Smash-style rules: damage percent drives knockback, blast zones
   cost a stock, last one standing wins.
   ============================================================= */
const GRAV=0.62, MAXFALL=16, GACC=1.15, AACC=0.55, GFRIC=0.80, AFRIC=0.96;
let fighters=[], shots=[], puddles=[], fx=[], bubbles=[];
let matchT=0, countdown=0, endT=0, shakeT=0, shakeMag=0, paused=false;
const PORT_COL = ['#d83a3a','#3a6fd8','#e0b14a','#4aa84a'];

const CONTROLS = [
  {l:'KeyA', r:'KeyD', up:'KeyW', dn:'KeyS', atk:'KeyJ', ab:'KeyE', w:['Digit1','Digit2','Digit3'], mouse:true},
  {l:'ArrowLeft', r:'ArrowRight', up:'ArrowUp', dn:'ArrowDown', atk:'Period', ab:'Slash', w:['Digit7','Digit8','Digit9']},
  {l:'KeyF', r:'KeyH', up:'KeyT', dn:'KeyG', atk:'KeyY', ab:'KeyU', w:['Digit4','Digit5','Digit6']},
  {l:'Numpad4', r:'Numpad6', up:'Numpad8', dn:'Numpad5', atk:'Numpad0', ab:'NumpadDecimal', w:['Numpad7','Numpad9','NumpadAdd']}
];

function makeFighter(slot, port, spawn){
  const c = slot.char;
  return {
    port, char:c, cpu:slot.type==='cpu', remote:G.mode==='party' && slot.type!=='cpu' && port!==Net.localSeat, netInput:null,
    x:spawn[0], y:spawn[1], vx:0, vy:0, facing: spawn[0]<W/2?1:-1,
    w:c.w, h:c.h, onGround:false, jumps:2, pct:0, stocks:G.stocks,
    state:'fall', animT:0, atk:0, atkMax:1, atkDone:false, wpn:0,
    hitstun:0, invuln:90, cd:0, charge:0, flash:0, inWater:false,
    dead:false, respawn:0, placement:0, lastHitBy:null, bleed:0
  };
}
function startMatch(){
  const st = STAGES[G.stage];
  fighters = []; shots=[]; puddles=[]; fx=[]; bubbles=[];
  let n=0;
  G.slots.forEach((s,i)=>{ if (s.type!=='off' && s.char) fighters.push(makeFighter(s, i, st.spawns[n++%4])); });
  matchT=0; countdown=190; endT=0; paused=false;
  G.result=null; G.screen='fight';
  stageBG(G.stage);
  SFX.pick();
}

/* ---------- input ---------- */
function readInput(p){
  if (p.remote && p.netInput) return p.netInput;
  if (p.cpu) return botInput(p);
  const c = CONTROLS[p.port];
  return {
    l: !!Keys[c.l], r: !!Keys[c.r], dn: !!Keys[c.dn],
    up: keyTap(c.up),
    atk: keyTap(c.atk) || (c.mouse && Mouse.clicked),
    ab: keyTap(c.ab),
    w: c.w.findIndex(k=>keyTap(k))
  };
}

/* ---------- collision ---------- */
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function feetBox(p){ return {x:p.x-p.w/2, y:p.y-p.h, w:p.w, h:p.h}; }

function movePlatforms(p){
  const st=STAGES[G.stage];
  p.onGround=false;
  for (const pl of st.plats){
    const halfW=p.w/2;
    if (p.x+halfW < pl.x || p.x-halfW > pl.x+pl.w) continue;
    if (p.vy >= 0 && p.y <= pl.y+pl.h*0.8 && p.y + p.vy >= pl.y - 0.1){
      if (pl.pass && p.dropping>0) continue;
      if (!pl.pass && p.prevY > pl.y+pl.h) continue;   // came from below a solid
      p.y = pl.y; p.vy = 0; p.onGround = true; p.jumps = 2;
      if (p.state==='fall'){ SFX.land(); fxPuff(p.x, p.y, 6, '#d8d0b8'); }
      break;
    }
  }
}

/* ---------- combat maths ---------- */
function applyHit(att, tgt, wp, custom){
  const dmg = custom?.dmg ?? wp.dmg;
  const base = custom?.kb ?? wp.kb;
  tgt.pct = Math.min(999, tgt.pct + dmg);
  const power = (base + dmg*0.35) * (1 + tgt.pct*0.021) / tgt.char.weight;
  let ang = custom?.angle;
  if (ang==null){
    ang = -0.78;                                     // default 45 degrees up
    if (wp.n==='LOCHABER AXE' && !tgt.onGround) ang = 1.25;  // spike
    if (wp.n==='SPORRAN SLAP') ang = -1.35;                   // pop-up
  }
  const dir = (tgt.x < att.x) ? -1 : 1;
  tgt.vx = Math.cos(ang)*power*dir*1.05;
  tgt.vy = Math.sin(ang)*power;
  tgt.hitstun = Math.min(48, 6 + power*2.0);
  tgt.state='hurt'; tgt.flash=10; tgt.lastHitBy=att.port;
  if (wp.n==='SGIAN DUBH') tgt.bleed = 120;          // slow bleed damage
  fxHit(tgt.x, tgt.y-tgt.h*0.55, power);
  if (power>13){ SFX.bigHit(); kick(8); } else { SFX.hit(tgt.pct); kick(3); }
}
function kick(m){ if (G.shake){ shakeT=10; shakeMag=Math.max(shakeMag,m); } }

/* attack hitbox in front of the fighter */
function attackBox(p, wp){
  const r = wp.range, a = wp.arc;
  return { x: p.facing>0 ? p.x+6 : p.x-6-r, y: p.y-p.h*0.78, w:r, h:a+p.h*0.35 };
}
function startAttack(p){
  const wp = p.char.weapons[p.wpn];
  p.atkMax = wp.startup+wp.active+wp.end;
  p.atk = p.atkMax; p.atkDone=false; p.state='attack';
  if (p.wpn===0) SFX.swing();
  else if (p.wpn===1) SFX.chop();
  else SFX.stab();
}

/* ---------- abilities (E) ---------- */
function useAbility(p){
  if (p.cd>0){ return; }
  const id = p.char.id;
  p.cd = p.char.abilityCd;
  if (id===0){                                   // haggis bomb
    shots.push({kind:'haggis', x:p.x+p.facing*20, y:p.y-p.h*0.6,
                vx:p.facing*7.4, vy:-7, life:210, owner:p.port, bounces:3, r:12});
    SFX.throwArc();
  } else if (id===1){                             // sonic drone / jet jump
    if (!p.onGround){ p.vy = -12.5; p.jumps=Math.max(p.jumps,1); p.state='jump'; SFX.jet();
      fxPuff(p.x,p.y,14,'#cfe8ef'); }
    shots.push({kind:'wave', x:p.x, y:p.y-p.h*0.55, r:14, life:34, owner:p.port});
    SFX.wave();
  } else if (id===2){                             // drowning pool
    if (p.onGround){
      puddles.push({x:p.x-58, y:p.y, w:116, life:520});
      SFX.stomp(); kick(6);
      for(let i=0;i<14;i++) fx.push({x:p.x+(Math.random()-0.5)*100, y:p.y-4,
        vx:(Math.random()-0.5)*3, vy:-Math.random()*3, life:26, col:'#5ec8f0', s:4});
    } else { p.vy = 15; p.state='fall'; p.cd*=0.4; }
  } else {                                        // royal charge
    p.charge = 30; p.state='charge'; p.vx = p.facing*15.5; p.invuln=6; SFX.charge();
  }
}

/* ---------- projectiles / effects ---------- */
function updateShots(){
  const st=STAGES[G.stage];
  for (let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    if (s.kind==='haggis'){
      s.vy += GRAV*0.72; s.x+=s.vx; s.y+=s.vy; s.life--;
      for (const pl of st.plats){
        if (s.x>pl.x && s.x<pl.x+pl.w && s.y>pl.y-6 && s.y<pl.y+10 && s.vy>0){
          s.y=pl.y-6; s.vy*=-0.55; s.vx*=0.8; s.bounces--;
          SFX.throwArc();
        }
      }
      fighters.forEach(f=>{
        if (f.port!==s.owner && !f.dead && Math.hypot(f.x-s.x, (f.y-f.h*0.5)-s.y) < 34){ s.life=0; s.bounces=-1; }
      });
      if (s.life<=0 || s.bounces<0){ explode(s.x,s.y,s.owner); shots.splice(i,1); }
    } else if (s.kind==='wave'){
      s.r += 7.5; s.life--;
      fighters.forEach(f=>{
        if (f.port===s.owner || f.dead) return;
        const d = Math.hypot(f.x-s.x, (f.y-f.h*0.5)-s.y);
        if (Math.abs(d-s.r)<26 && !f.waved){
          f.waved = 12;
          applyHit({x:s.x,port:s.owner}, f, {n:'DRONE',dmg:7,kb:7}, {dmg:7,kb:8});
        }
      });
      shots.forEach(o=>{ if (o!==s && o.owner!==s.owner && Math.hypot(o.x-s.x,o.y-s.y)<s.r+16){
        o.vx*=-1.2; o.owner=s.owner; }});
      if (s.life<=0) shots.splice(i,1);
    }
  }
  fighters.forEach(f=>{ if (f.waved>0) f.waved--; });
}
function explode(x,y,owner){
  SFX.boom(); kick(11);
  for(let i=0;i<26;i++) fx.push({x, y, vx:(Math.random()-0.5)*11, vy:(Math.random()-0.5)*11,
    life:30+Math.random()*16, col: i%3?'#f2a03c':'#8d6b2a', s:5});
  fighters.forEach(f=>{
    if (f.dead) return;
    const d = Math.hypot(f.x-x, (f.y-f.h*0.5)-y);
    if (d<108 && f.port!==owner) applyHit({x, port:owner}, f, {n:'HAGGIS',dmg:16,kb:11}, {dmg:16,kb:11});
  });
}
function fxHit(x,y,power){
  for(let i=0;i<Math.min(18,6+power);i++) fx.push({x,y, vx:(Math.random()-0.5)*8,
    vy:(Math.random()-0.5)*8, life:16+Math.random()*10, col: i%2?'#fff3d0':'#f2c33c', s:4});
}
function fxPuff(x,y,n,col){
  for(let i=0;i<n;i++) fx.push({x,y, vx:(Math.random()-0.5)*4, vy:-Math.random()*2.4,
    life:18+Math.random()*10, col, s:4});
}
function updateFX(){
  for (let i=fx.length-1;i>=0;i--){
    const p=fx[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.life--;
    if (p.life<=0) fx.splice(i,1);
  }
  for (let i=puddles.length-1;i>=0;i--){ if (--puddles[i].life<=0) puddles.splice(i,1); }
  const st=STAGES[G.stage];
  if (st.water!=null){
    for (let i=bubbles.length-1;i>=0;i--){
      const b=bubbles[i]; b.y-=b.sp; b.x+=Math.sin(b.y*0.05)*0.6; b.life--;
      if (b.y<st.water || b.life<=0) bubbles.splice(i,1);
    }
  }
}

/* =============================================================
   15. FIGHTER UPDATE
   ============================================================= */
function updateFighter(p){
  const st = STAGES[G.stage];
  p.prevY = p.y;
  p.animT++;
  if (p.flash>0) p.flash--;
  if (p.cd>0) p.cd--;
  if (p.invuln>0) p.invuln--;
  if (p.dropping>0) p.dropping--;
  if (p.bleed>0 && p.bleed--%30===0){ p.pct=Math.min(999,p.pct+1); }

  if (p.respawn>0){
    p.respawn--;
    if (p.respawn===0){ p.dead=false; p.x=W/2+(p.port-1.5)*70; p.y=60; p.vx=0; p.vy=0;
                        p.pct=0; p.invuln=120; p.state='fall'; }
    return;
  }
  if (p.dead) return;

  const inp = readInput(p);
  const spd = p.char.speed;
  const slip = puddles.some(q=> p.onGround && p.x>q.x && p.x<q.x+q.w && Math.abs(p.y-q.y)<12);
  p.inWater = st.water!=null && p.y > st.water;

  if (p.hitstun>0){
    p.hitstun--; p.state='hurt';
  } else if (p.charge>0){
    p.charge--; p.state='charge';
    fighters.forEach(o=>{ if (o!==p && !o.dead && Math.abs(o.x-p.x)<46 && Math.abs(o.y-p.y)<60)
      { applyHit(p,o,{n:'CHARGE',dmg:14,kb:11},{dmg:14,kb:11,angle:-0.55}); p.charge=0; } });
    if (p.charge===0) p.vx*=0.3;
  } else {
    // weapon swapping — free, any time, as often as you like
    if (inp.w>=0 && inp.w<3 && inp.w!==p.wpn){ p.wpn=inp.w; SFX.swapWeapon(); }
    if (p.atk>0){
      p.atk--;
      const wp = p.char.weapons[p.wpn];
      const el = p.atkMax - p.atk;
      if (el>=wp.startup && el<wp.startup+wp.active && !p.atkDone){
        const box = attackBox(p, wp);
        fighters.forEach(o=>{
          if (o===p || o.dead || o.invuln>0) return;
          if (overlap(box, feetBox(o))){ applyHit(p,o,wp); p.atkDone=true;
            if (p.wpn===0||p.wpn===1) SFX.clang(); }
        });
        shots.forEach(s=>{ if (s.owner!==p.port && overlap(box,{x:s.x-12,y:s.y-12,w:24,h:24})){ s.vx*=-1.3; s.owner=p.port; } });
      }
      if (p.atk===0) p.state = p.onGround?'idle':'fall';
    } else {
      if (inp.atk) startAttack(p);
      else if (inp.ab) useAbility(p);
      // walking
      const acc = p.onGround ? (slip?0.35:GACC) : AACC;
      if (inp.l){ p.vx -= acc; p.facing=-1; }
      if (inp.r){ p.vx += acc; p.facing= 1; }
      const cap = spd * (p.inWater?0.68:1);
      p.vx = Math.max(-cap*1.6, Math.min(cap*1.6, p.vx));
      if (!inp.l && !inp.r) p.vx *= p.onGround ? (slip?0.985:GFRIC) : AFRIC;
      // jumping
      if (inp.up && (p.jumps>0 || p.inWater)){
        if (p.inWater){ p.vy = -8.4; SFX.splash(); }
        else { p.vy = -p.char.jump * (p.jumps===2?1:0.86); p.jumps--;
               p.jumps===1 ? SFX.jump() : SFX.djump(); fxPuff(p.x,p.y,5,'#e8e2d2'); }
      }
      if (inp.dn && p.onGround) p.dropping = 9;          // fall through hammocks
      if (inp.dn && !p.onGround) p.vy += 0.9;            // fast fall
      p.state = !p.onGround ? (p.vy<0?'jump':'fall') : (Math.abs(p.vx)>0.8?'run':'idle');
    }
  }

  // gravity + water buoyancy
  if (p.inWater){
    p.vy = Math.min(p.vy + GRAV*0.26, 6.2);
    p.vy *= 0.92; p.vx *= 0.93;
    if (p.state!=='hurt') p.state='swim';
    p.jumps = 1;
    if (Math.random()<0.35) bubbles.push({x:p.x+(Math.random()-0.5)*30, y:p.y-10,
      sp:0.9+Math.random()*1.3, r:2+Math.random()*4, life:200});
    if (Math.random()<0.04) SFX.bubble();
  } else {
    p.vy = Math.min(p.vy + GRAV, MAXFALL);
  }
  p.x += p.vx; p.y += p.vy;
  movePlatforms(p);

  // blast zones
  if (p.x<-140 || p.x>W+140 || p.y<-260 || p.y>st.blastBottom) loseStock(p);
}
function loseStock(p){
  p.stocks--; p.dead=true; p.respawn=90; p.vx=p.vy=0; p.bleed=0;
  SFX.ko(); kick(14);
  fxPuff(Math.max(20,Math.min(W-20,p.x)), Math.max(20,Math.min(H-20,p.y)), 24, PORT_COL[p.port]);
  if (p.stocks<=0){
    p.placement = fighters.filter(f=>f.stocks<=0).length;   // 1 = first out
    checkEnd();
  }
}
function checkEnd(){
  const alive = fighters.filter(f=>f.stocks>0);
  if (alive.length<=1 && endT===0){
    endT = 170;
    const win = alive[0] || fighters[0];
    const order = fighters.slice().sort((a,b)=> (b.stocks-a.stocks) || (b.placement-a.placement));
    G.result = {winner:win, order};
  }
}

/* =============================================================
   16. BOT AI — reads the same input shape a human produces
   ============================================================= */
function botInput(p){
  const lvl = G.cpuLevel;
  const st = STAGES[G.stage];
  const foes = fighters.filter(f=>f!==p && !f.dead && f.stocks>0);
  const inp = {l:false,r:false,up:false,dn:false,atk:false,ab:false,w:-1};
  if (!foes.length || countdown>0) return inp;
  let t = foes[0], best=1e9;
  foes.forEach(f=>{ const d=Math.hypot(f.x-p.x,f.y-p.y); if (d<best){best=d;t=f;} });
  p.think = (p.think||0)-1;

  const main = st.plats[0];
  const offStage = p.x < main.x-10 || p.x > main.x+main.w+10;
  if (offStage && p.y > main.y-40){                     // recover
    inp[p.x < main.x ? 'r':'l'] = true;
    if (p.vy>1 && Math.random()<0.25) inp.up = true;
    if (p.char.id===1 && p.y>main.y+50 && Math.random()<0.1) inp.ab=true;
    return inp;
  }
  const dx = t.x-p.x, dy = t.y-p.y;
  const reach = p.char.weapons[p.wpn].range;
  if (Math.abs(dx) > reach*0.72) inp[dx>0?'r':'l'] = true;
  else if (Math.abs(dx) < reach*0.3 && lvl>1) inp[dx>0?'l':'r'] = true;   // spacing
  if (dy < -50 && Math.random()<0.06+lvl*0.02) inp.up = true;
  if (Math.abs(dx)<reach && Math.abs(dy)<70 && Math.random()< (0.05+lvl*0.05)) inp.atk = true;
  if (p.cd===0 && Math.abs(dx)<260 && Math.random()< (0.006*lvl)) inp.ab = true;
  if (p.think<=0 && lvl>1){                            // occasionally rethink weapon
    p.think = 90;
    inp.w = Math.abs(dx)>90 ? 1 : (t.pct>80 ? 0 : 2);
  }
  if (!p.onGround && p.y>main.y-20 && p.x>main.x && p.x<main.x+main.w && Math.random()<0.3) inp.up=true;
  return inp;
}

/* =============================================================
   17. DRAWING THE FIGHT
   ============================================================= */
function drawPlatform(pl){
  const {x,y,w,h,kind} = pl;
  if (kind==='grass'){
    rect(x,y,w,h,'#4a3a22');
    for(let i=0;i<w;i+=8) rect(x+i,y+6,4,h-6,'#3a2c18');
    rect(x,y,w,7,'#6f9e34'); rect(x,y,w,3,'#8fc44a');
    for(let i=0;i<w;i+=10) rect(x+i,y-3,3,4,'#8fc44a');
  } else if (kind==='metal'){
    rect(x,y,w,h,'#9aa6ad'); rect(x,y,w,3,'#e2ecef'); rect(x,y+h-3,w,3,'#5c666d');
    for(let i=0;i<w;i+=16) rect(x+i,y+3,2,h-6,'#7c888f');
    for(let i=6;i<w;i+=32) rect(x+i,y+h/2-2,4,4,'#3c464d');
  } else if (kind==='wood'){
    rect(x,y,w,h,'#6b4a23'); rect(x,y,w,3,'#8f6832'); rect(x,y+h-3,w,3,'#3a2712');
    for(let i=0;i<w;i+=22) rect(x+i,y,2,h,'#4a3318');
    for (let i=8;i<w;i+=26){ rect(x+i,y+h,2,8,'#c9b08a'); }    // hammock ropes
  } else {
    rect(x,y,w,h,'#7a7266'); rect(x,y,w,4,'#a79c8c'); rect(x,y+h-4,w,4,'#4e483f');
    for(let i=0;i<w;i+=26) rect(x+i,y+4,3,h-8,'#5e574c');
  }
}
function drawStageLayer(){
  const st = STAGES[G.stage], i=G.stage;
  ctx.drawImage(stageBG(i),0,0);
  // animated layer on top of the baked photo
  if (i===0){
    ctx.globalAlpha=0.08+Math.sin(matchT*0.02)*0.03; ctx.fillStyle='#d8f7ff';
    for (let k=0;k<6;k++){ const x=-80+k*190+Math.sin(matchT*0.006+k)*22;
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+44,0); ctx.lineTo(x+130,H); ctx.lineTo(x+80,H); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  if (i===1 || i===2){
    ctx.globalAlpha=0.5; ctx.fillStyle='#ffffff';
    for (let k=0;k<5;k++){
      const x=((matchT*0.24 + k*260) % (W+300))-150, y=60+k*32;
      ctx.fillRect(x,y,120,10); ctx.fillRect(x+24,y-8,70,10);
    }
    ctx.globalAlpha=1;
  }
  if (i===3){
    [[150,150],[810,150],[480,120]].forEach(([tx,ty],k)=>{
      const fl = 0.7+Math.sin(matchT*0.2+k*2)*0.3;
      rect(tx-4,ty,8,26,'#5a3d1e');
      ctx.globalAlpha=fl; rect(tx-8,ty-18,16,20,'#f2a03c'); rect(tx-5,ty-26,10,12,'#f6e08a');
      ctx.globalAlpha=fl*0.16; rect(tx-70,ty-60,140,180,'#f2a03c'); ctx.globalAlpha=1;
    });
  }
  // puddles conjured by the kelpie
  puddles.forEach(q=>{
    const a = Math.min(1,q.life/60);
    ctx.globalAlpha=0.65*a; rect(q.x,q.y-5,q.w,7,'#3f9fd0');
    ctx.globalAlpha=0.9*a;  rect(q.x,q.y-5,q.w,2,'#a9e4f5');
    ctx.globalAlpha=1;
  });
  STAGES[G.stage].plats.forEach(drawPlatform);
  // the loch water sits in front of the platforms
  if (st.water!=null){
    const wl = st.water;
    ctx.globalAlpha=0.46; rect(0,wl,W,H-wl,'#1a86a8'); ctx.globalAlpha=1;
    for (let x=0;x<W;x+=6){
      const y = wl + Math.sin(x*0.035 + matchT*0.06)*4;
      rect(x,y,6,4,'#8fe0f0'); rect(x,y+4,6,6,'#2ea3c4');
    }
    bubbles.forEach(b=>{ ctx.globalAlpha=0.7; rect(b.x,b.y,b.r,b.r,'#cfeffa'); ctx.globalAlpha=1; });
  }
}
function drawShots(){
  shots.forEach(s=>{
    if (s.kind==='haggis'){
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(matchT*0.18);
      blit(HAGGIS, WPN_PAL, -15, -12, 5, false); ctx.restore();
    } else if (s.kind==='wave'){
      ctx.globalAlpha = Math.max(0, s.life/34);
      ctx.strokeStyle='#cfe8ef'; ctx.lineWidth=6;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke();
      ctx.strokeStyle='#8fd3ff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r-7,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=1;
    }
  });
  fx.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.life/16); rect(p.x,p.y,p.s,p.s,p.col); ctx.globalAlpha=1; });
}
function drawFighters(){
  fighters.forEach(p=>{
    if (p.dead) return;
    // shadow on the ground below
    ctx.globalAlpha=0.25; rect(p.x-p.w/2, p.y-4, p.w, 6, '#000'); ctx.globalAlpha=1;
    const a = {state:p.state, t:p.animT, atk:p.atk, atkMax:p.atkMax, weapon:p.wpn, flash:p.invuln>0?1:p.flash};
    drawCharacter(p.char.id, p.x, p.y, p.facing, a);
    // port marker
    const tipY = p.y-p.h-16;
    rect(p.x-13, tipY-2, 26, 14, '#1a0d03');
    pxText('P'+(p.port+1), p.x, tipY+1, 2, PORT_COL[p.port], 'center');
    if (p.bleed>0 && matchT%6<3) rect(p.x+p.facing*8, p.y-p.h*0.5, 3,3,'#b41e2a');
  });
}
/* ---------- HUD ---------- */
function drawHUD(){
  // weapon rack, top left, exactly where the spec asked for it
  const me = fighters.find(f=>!f.cpu && !f.remote) || fighters[0];
  if (me){
    woodPanel(10,10,254,96,false);
    tartanStrip(16,16,242,8);
    pxText('ARM', 22, 30, 2, '#c9a978');
    me.char.weapons.forEach((wp,i)=>{
      const x=20+i*80, y=40, sel = me.wpn===i;
      rect(x-2,y-2,76,40, sel?'#f2c33c':'#2a1a0a');
      rect(x,y,72,36, sel?'#5e4a1e':'#3a2c18');
      pxText(String(i+1), x+5, y+4, 2, sel?'#fff3d0':'#9a8a6a');
      const nm = wp.n.split(' ')[0];
      pxText(nm.slice(0,8), x+36, y+14, 2, sel?'#fff3d0':'#bfa270','center');
      pxText(wp.note.split(' ')[0].slice(0,8), x+36, y+26, 1, '#c9a978','center');
    });
    // ability charge
    const w = 244*(1-me.cd/me.char.abilityCd);
    rect(16,92,244,10,'#2a1a0a'); rect(16,92,Math.max(0,w),10, me.cd?'#9a6a2a':'#9fd45a');
    pxText('E - '+me.char.ability, 138, 93, 1, '#1a0d03','center');
  }
  // stock + damage panels
  const n = fighters.length;
  const pw = Math.min(214, (W-40)/n - 10);
  fighters.forEach((p,i)=>{
    const x = 20 + i*(pw+10) + (W-40-(n*(pw+10)-10))/2, y=H-92;
    woodPanel(x,y,pw,80, false);
    rect(x+6,y+6,pw-12,6, PORT_COL[p.port]);
    pxText('P'+(p.port+1), x+10, y+18, 2, PORT_COL[p.port]);
    pxText(p.char.name.slice(0,14), x+pw-8, y+18, 1, '#c9a978','right');
    const dmg = Math.floor(p.pct);
    const col = dmg<50?'#f7e6bd' : dmg<100?'#f2c33c' : dmg<150?'#e07a2a':'#d83a3a';
    pxText(dmg+'%', x+pw/2, y+30, 5, col,'center','#160c03');
    for (let s=0;s<Math.max(0,p.stocks);s++) thistle(x+16+s*20, y+70, 3);
    if (p.dead && p.stocks>0) pxText('...', x+pw/2, y+70, 2, '#9a8a6a','center');
  });
}
/* ---------- fight orchestration ---------- */
function updateFight(){
  if (keyTap('Escape')){ paused=!paused; SFX.back(); }
  if (paused){
    if (keyTap('Enter')) paused=false;
    if (keyTap('KeyQ')){ paused=false; setScreen('play'); }
    return;
  }
  matchT++;
  if (countdown>0){ countdown--; if (countdown===120) SFX.fight(); return; }
  fighters.forEach(updateFighter);
  updateShots(); updateFX();
  // packet the local player's frame for whatever transport is attached later
  const me = fighters.find(f=>!f.cpu && !f.remote);
  if (me && Net.status!=='offline') Net.send({seat:me.port, frame:matchT, input:readInput(me)});
  if (endT>0 && --endT===0) showVictory();
}
function drawFight(){
  ctx.save();
  if (shakeT>0){ shakeT--; shakeMag*=0.86;
    ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag); }
  drawStageLayer();
  drawShots();
  drawFighters();
  ctx.restore();
  drawHUD();
  if (countdown>0){
    const p = 1-countdown/190;
    const s = 6 + Math.sin(p*Math.PI*3)*3;
    ctx.globalAlpha=0.45; rect(0,H/2-70,W,140,'#0b1020'); ctx.globalAlpha=1;
    pxText('SABAID!', W/2, H/2-32, Math.max(4,s+4), '#f2c33c','center','#5c2410',1.3);
    pxText(STAGES[G.stage].pretty, W/2, H/2+34, 2, '#e7cfa3','center');
  }
  if (endT>0){
    ctx.globalAlpha=0.5; rect(0,H/2-60,W,120,'#0b1020'); ctx.globalAlpha=1;
    pxText('GEAM THAIRIS', W/2, H/2-24, 6, '#f7e6bd','center','#5c2410',1.3);
  }
  if (paused){
    ctx.globalAlpha=0.7; rect(0,0,W,H,'#0b1020'); ctx.globalAlpha=1;
    woodPanel(W/2-200,H/2-90,400,180,true);
    pxText('STAD', W/2, H/2-64, 6, '#f2c33c','center','#160c03');
    pxText('ENTER - RESUME', W/2, H/2-4, 2, '#e7cfa3','center');
    pxText('Q - LEAVE THE FIELD', W/2, H/2+24, 2, '#e7cfa3','center');
  }
}

/* =============================================================
   18. BUAIDH — the victory screen
   Angled panels, a laurel-wrapped number one, and the winner at
   an absurd scale on the right.
   ============================================================= */
function showVictory(){
  G.screen='victory'; SFX.victory();
  const win = G.result.winner;
  const arcadeGoing = G.mode==='arcade' && !win.cpu && (G.arcadeRound||1)<3;
  const items=[];
  if (arcadeGoing) items.push({x:40,y:470,w:250,h:48,label:'NEXT BOUT', go:nextArcadeBout});
  items.push({x:arcadeGoing?302:40, y:470, w:250, h:48, label:'REMATCH', go:()=>startMatch()});
  items.push({x:arcadeGoing?564:302, y:470, w:250, h:48, label:'FIGHTERS', go:()=>setScreen('char')});
  items.push({x:arcadeGoing?826:564, y:470, w:arcadeGoing?94:250, h:48, label:'HOME', go:()=>setScreen('home')});
  setMenu(items);
}
function nextArcadeBout(){
  G.arcadeRound = (G.arcadeRound||1)+1;
  const foe = CHARS[Math.floor(Math.random()*4)];
  G.slots[1] = {type:'cpu', char:foe};
  G.stage = Math.floor(Math.random()*4);
  startMatch();
}
/* pixel laurel wreath drawn as two arcs of leaves */
function laurel(cx,cy,r){
  for (let side=-1;side<=1;side+=2){
    for (let i=0;i<9;i++){
      const a = -1.25 + i*0.26;
      const x = cx + Math.sin(a)*r*side, y = cy - Math.cos(a)*r*0.92 + r*0.5;
      const s = 7 - Math.abs(i-4)*0.5;
      rect(x-s/2, y-s/2, s, s*0.8, i%2?'#2f6b2a':'#3f8a33');
      rect(x-s/2+side*s*0.6, y-s*0.2, s*0.8, s*0.6, '#57a83f');
    }
  }
}
function drawVictory(){
  const r = G.result; if (!r){ setScreen('home'); return; }
  const win = r.winner;
  vgradScreen([[0,'#2b3a5e'],[0.55,'#4a4a6e'],[1,'#7a5a3a']]);
  // angled graphic lines sweeping behind everything
  ctx.save();
  for (let i=0;i<7;i++){
    ctx.globalAlpha = 0.10 + (i%2)*0.06;
    ctx.fillStyle = i%2 ? '#f2c33c' : '#0b2a63';
    ctx.beginPath();
    const y0 = -120 + i*110;
    ctx.moveTo(0,y0); ctx.lineTo(W,y0-150); ctx.lineTo(W,y0-96); ctx.lineTo(0,y0+56); ctx.fill();
  }
  ctx.restore();
  // giant winner on the right
  ctx.save(); ctx.translate(W-232, H-76); ctx.scale(3.1,3.1);
  drawCharacter(win.char.id, 0, 0, -1, {state:'idle', t:G.t, atk:0, atkMax:1, weapon:win.wpn, flash:0});
  ctx.restore();
  // victory banner across the top, tilted
  ctx.save(); ctx.translate(W/2, 46); ctx.rotate(-0.035);
  tartanStrip(-W/2, -30, W, 14);
  rect(-W/2,-16,W,58,'#0b2a63');
  rect(-W/2,-16,W,4,'#f2c33c'); rect(-W/2,38,W,4,'#f2c33c');
  pxText('BUAIDH', 0, -8, 7, '#f7e6bd','center','#5c2410',1.3);
  pxText('VICTORY TO THE HIGHLANDS', 0, 44, 2, '#cfd8e6','center');
  ctx.restore();
  // P-tag, laurel and the big gold one
  rect(46,116,74,34,'#d83a3a'); rect(46,116,74,4,'#f28a8a');
  pxText('P'+(win.port+1), 83, 124, 3, '#ffffff','center','#5c1010');
  laurel(214,150,58);
  pxText('1', 214, 108, 9, '#f2c33c','center','#6b4a10',1.4);
  // winner name, huge
  const nm = win.char.pretty;
  const sc = nm.length>14 ? 5 : 7;
  pxText(nm, 44, 214, sc, '#12100e','left','#f7e6bd',-0.35);
  pxText(win.char.tag, 48, 214+sc*8+10, 2, '#f2e3c0','left');
  // podium panels, angled, for 2nd / 3rd / 4th
  const rest = r.order.filter(f=>f!==win).slice(0,3);
  rest.forEach((f,i)=>{
    const x = 40+i*162, y = 306+i*10;
    ctx.save(); ctx.translate(x,y); ctx.rotate(-0.045);
    rect(-6,-6,152,132,'#12100e');
    rect(0,0,140,120, ['#4a6fd8','#e0b14a','#4aa84a'][i]);
    rect(6,6,128,108,'#1d2a3a');
    ctx.save(); ctx.translate(70,112); ctx.scale(0.82,0.82);
    drawCharacter(f.char.id, 0, 0, 1, {state:'idle', t:G.t+i*40, atk:0, atkMax:1, weapon:0, flash:0});
    ctx.restore();
    pxText(String(i+2), 14, 10, 5, '#f7e6bd','left','#12100e');
    rect(0,120,140,16,'#12100e');
    pxText(f.char.name.slice(0,15), 70, 122, 1, '#e7cfa3','center');
    ctx.restore();
  });
  drawMenu();
}

/* =============================================================
   19. MAIN LOOP
   ============================================================= */
function frame(){
  G.t++;
  ctx.imageSmoothingEnabled = false;
  switch (G.screen){
    case 'home':     updateMenu(); drawHome(); break;
    case 'play':     updateMenu(); drawPlay(); break;
    case 'pvb':      updateMenu(); drawPvB(); break;
    case 'settings': updateMenu(); drawSettings(); break;
    case 'more':     updateMenu(); drawMore(); break;
    case 'lobby':    updateMenu(); drawLobby(); break;
    case 'char':     updateCharSelect(); drawCharSelect(); break;
    case 'stage':    updateStageSelect(); drawStageSelect(); break;
    case 'fight':    updateFight(); drawFight(); break;
    case 'victory':  updateMenu(); drawVictory(); break;
  }
  // scanline sheen so the whole thing reads as a CRT cabinet
  ctx.globalAlpha=0.06; ctx.fillStyle='#000';
  for (let y=0;y<H;y+=3) ctx.fillRect(0,y,W,1);
  ctx.globalAlpha=1;
  clearFrameInput();
  requestAnimationFrame(frame);
}

/* ---- boot ---- */
Audio8.setVolume(G.volume);
loadArt();
if (urlRoom){ G.mode='party'; Net.join(urlRoom.trim().toUpperCase()); setScreen('lobby'); }
else setScreen('home');
frame();
</script>
